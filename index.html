<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#111312">
  <title>Guía de entrenamientos · SG Padel Academy</title>
  <link rel="icon" href="favicon.png" type="image/png">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="app-shell">
    <aside class="sidebar" id="sidebar">
      <a class="brand" href="#" aria-label="SG Padel Academy"><img src="logo-sg-padel-academy-tight.png" alt="SG Padel Academy"></a>
      <div class="program-label"><span>Guía trimestral</span><strong>24 sesiones</strong></div>
      <label class="search-box">
        <span class="sr-only">Buscar sesión</span>
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m21 21-4.5-4.5m2.5-5a7.5 7.5 0 1 1-15 0 7.5 7.5 0 0 1 15 0Z"/></svg>
        <input id="sessionSearch" type="search" placeholder="Buscar sesión…">
      </label>
      <nav class="session-list" id="sessionList" aria-label="Sesiones"></nav>
      <p class="sidebar-note">Selecciona una sesión, adapta el grupo y edita únicamente lo que necesites.</p>
    </aside>

    <main class="workspace">
      <header class="topbar">
        <button class="icon-btn mobile-menu" id="menuBtn" type="button" aria-label="Abrir sesiones">
          <svg viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
        </button>
        <p>Guía de entrenamiento</p>
        <div class="top-actions">
          <button class="action-btn" id="editBtn" type="button" aria-pressed="false"><span>Editar</span></button>
          <button class="action-btn primary" id="saveBtn" type="button"><span>Guardar</span></button>
          <button class="action-btn" id="printBtn" type="button"><span>Imprimir</span></button>
        </div>
      </header>

      <article class="session-page">
        <header class="session-header">
          <div class="session-number"><span>Sesión</span><strong id="sessionNumber">01</strong></div>
          <div class="session-copy">
            <p id="sessionBlock">Bloque 1 · Control y espacio</p>
            <h1 id="sessionTitle" data-editable></h1>
            <div class="objective"><b>Objetivo</b><p id="sessionObjective" data-editable></p></div>
          </div>
          <div class="duration"><strong>75</strong><span>min</span></div>
        </header>

        <section class="group-bar" aria-label="Adaptación del grupo">
          <label>Categoría
            <select id="categoryField"><option>Prebenjamín</option><option>Benjamín</option><option selected>Alevín</option><option>Infantil</option><option>Cadete</option><option>Juvenil</option></select>
          </label>
          <label>Nivel
            <select id="levelField"><option>Iniciación</option><option selected>Intermedio</option><option>Alto</option></select>
          </label>
          <div class="adaptation"><span>Adaptación recomendada</span><p id="adaptationText"></p></div>
        </section>

        <section class="guide-grid" id="guideGrid" aria-label="Desarrollo de la sesión"></section>

        <footer class="session-footer">
          <label>Notas del entrenador
            <textarea id="notesField" rows="2" placeholder="Material, ajustes o aspectos a retomar…"></textarea>
          </label>
          <nav class="session-nav" aria-label="Navegación entre sesiones">
            <button id="prevBtn" type="button">← Anterior</button><span id="navCount">01 / 24</span><button id="nextBtn" type="button">Siguiente →</button>
          </nav>
        </footer>
      </article>
    </main>
  </div>
  <button class="sidebar-backdrop" id="sidebarBackdrop" type="button" aria-label="Cerrar sesiones"></button>
  <div class="toast" id="toast" role="status" aria-live="polite"></div>
  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
